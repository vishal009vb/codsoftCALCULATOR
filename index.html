<!DOCTYPE html>
<html>
<head>
    <title>My Calculator</title>
    <link rel="stylesheet" href="st.css">
</head>
<body>

    <div class="container">
        <h2>Simple Calculator</h2>
        <div class="calculator">
            <input type="text" id="screen" disabled>
            
            <div class="row">
                <button onclick="clearScreen()" class="btn-red">C</button>
                <button onclick="display('/')">/</button>
                <button onclick="display('*')">x</button>
                <button onclick="deleteLast()" class="btn-yellow">DEL</button>
            </div>

            <div class="row">
                <button onclick="display('7')">7</button>
                <button onclick="display('8')">8</button>
                <button onclick="display('9')">9</button>
                <button onclick="display('-')">-</button>
            </div>

            <div class="row">
                <button onclick="display('4')">4</button>
                <button onclick="display('5')">5</button>
                <button onclick="display('6')">6</button>
                <button onclick="display('+')">+</button>
            </div>

            <div class="row">
                <button onclick="display('1')">1</button>
                <button onclick="display('2')">2</button>
                <button onclick="display('3')">3</button>
                <button onclick="calculate()" class="btn-green">=</button>
            </div>

            <div class="row">
                <button onclick="display('0')" style="width: 100%;">0</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
