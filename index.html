<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Calculator</title>
    <link rel="stylesheet" href="st.css">
</head>
<body>
    <div class="calculator">
        <div class="display">
            <div class="previous-operand" id="previous"></div>
            <div class="current-operand" id="current">0</div>
        </div>
        
        <div class="buttons">
            <button class="btn btn-clear" data-action="clear">AC</button>
            <button class="btn btn-delete" data-action="delete">DEL</button>
            <button class="btn btn-operator" data-operator="/">÷</button>
            <button class="btn btn-operator" data-operator="*">×</button>
            
            <button class="btn btn-number" data-number="7">7</button>
            <button class="btn btn-number" data-number="8">8</button>
            <button class="btn btn-number" data-number="9">9</button>
            <button class="btn btn-operator" data-operator="-">−</button>
            
            <button class="btn btn-number" data-number="4">4</button>
            <button class="btn btn-number" data-number="5">5</button>
            <button class="btn btn-number" data-number="6">6</button>
            <button class="btn btn-operator" data-operator="+">+</button>
            
            <button class="btn btn-number" data-number="1">1</button>
            <button class="btn btn-number" data-number="2">2</button>
            <button class="btn btn-number" data-number="3">3</button>
            <button class="btn btn-equals" data-action="equals">=</button>
            
            <button class="btn btn-number btn-zero" data-number="0">0</button>
            <button class="btn btn-number" data-number=".">.</button>
        </div>
    </div>

    <script>
        // Calculator state
        let currentOperand = '0';
        let previousOperand = '';
        let operation = null;

        // DOM elements
        const currentDisplay = document.getElementById('current');
        const previousDisplay = document.getElementById('previous');

        // Get all buttons
        const numberButtons = document.querySelectorAll('[data-number]');
        const operatorButtons = document.querySelectorAll('[data-operator]');
        const clearButton = document.querySelector('[data-action="clear"]');
        const deleteButton = document.querySelector('[data-action="delete"]');
        const equalsButton = document.querySelector('[data-action="equals"]');

        // Add event listeners to number buttons
        numberButtons.forEach(button => {
            button.addEventListener('click', () => {
                appendNumber(button.dataset.number);
                updateDisplay();
            });
        });

        // Add event listeners to operator buttons
        operatorButtons.forEach(button => {
            button.addEventListener('click', () => {
                chooseOperation(button.dataset.operator);
                updateDisplay();
            });
        });

        // Clear button
        clearButton.addEventListener('click', () => {
            clear();
            updateDisplay();
        });

        // Delete button
        deleteButton.addEventListener('click', () => {
            deleteNumber();
            updateDisplay();
        });

        // Equals button
        equalsButton.addEventListener('click', () => {
            compute();
            updateDisplay();
        });

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9' || e.key === '.') {
                appendNumber(e.key);
                updateDisplay();
            } else if (e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/') {
                chooseOperation(e.key);
                updateDisplay();
            } else if (e.key === 'Enter' || e.key === '=') {
                compute();
                updateDisplay();
            } else if (e.key === 'Escape') {
                clear();
                updateDisplay();
            } else if (e.key === 'Backspace') {
                deleteNumber();
                updateDisplay();
            }
        });

        function appendNumber(number) {
            if (number === '.' && currentOperand.includes('.')) return;
            if (currentOperand === '0' && number !== '.') {
                currentOperand = number;
            } else {
                currentOperand += number;
            }
        }

        function deleteNumber() {
            currentOperand = currentOperand.slice(0, -1);
            if (currentOperand === '') {
                currentOperand = '0';
            }
        }

        function clear() {
            currentOperand = '0';
            previousOperand = '';
            operation = null;
        }

        function chooseOperation(op) {
            if (currentOperand === '') return;
            if (previousOperand !== '') {
                compute();
            }
            operation = op;
            previousOperand = currentOperand;
            currentOperand = '';
        }

        function compute() {
            let computation;
            const prev = parseFloat(previousOperand);
            const current = parseFloat(currentOperand);
            
            if (isNaN(prev) || isNaN(current)) return;
            
            if (operation === '+') {
                computation = prev + current;
            } else if (operation === '-') {
                computation = prev - current;
            } else if (operation === '*') {
                computation = prev * current;
            } else if (operation === '/') {
                if (current === 0) {
                    alert('Cannot divide by zero!');
                    clear();
                    updateDisplay();
                    return;
                }
                computation = prev / current;
            } else {
                return;
            }
            
            currentOperand = computation.toString();
            operation = null;
            previousOperand = '';
        }

        function updateDisplay() {
            currentDisplay.textContent = currentOperand;
            if (operation != null) {
                previousDisplay.textContent = `${previousOperand} ${operation}`;
            } else {
                previousDisplay.textContent = '';
            }
        }
    </script>
</body>
</html>
